<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Portfolio{% endblock %}</title>

    {% load static %}
    {% load tz %}

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        /* ---------------- BODY ---------------- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #0f172a;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------------- NAVBAR ---------------- */
        nav {
            background: #020617;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        nav .logo {
            font-size: 20px;
            font-weight: bold;
            color: #e5e7eb;
        }
        nav .links a {
            margin-left: 20px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 16px;
        }
        nav .links a:hover {
            color: #ffffff;
        }

        /* ---------------- MAIN CONTAINER ---------------- */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px 40px;
            flex: 1;
        }

        h1, h2, h3 {
            color: #f9fafb;
        }

        /* ---------------- BUTTON ---------------- */
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            border-radius: 6px;
            background: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.6);
        }

        /* ---------------- CARD + ZOOM ANIMATION ---------------- */
        .card {
            background: #020617;
            border-radius: 8px;
            padding: 15px 18px;
            margin-bottom: 15px;
            border: 1px solid #1f2937;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        input, textarea {
            background: #020617;
            color: #e5e7eb;
            border-radius: 6px;
            border: 1px solid #1f2937;
        }

        /* ---------------- FOOTER ---------------- */
        footer {
            margin-top: 50px;
            padding: 30px 20px;
            background: #0b0f1a;
            border-top: 1px solid #1e293b;
            text-align: center;
            color: #e5e5e5;
        }
        footer a {
            text-decoration: none;
            color: #e5e5e5;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        footer a:hover {
            transform: translateY(-2px);
            color: #ffffff;
        }
        footer a i {
            transition: transform 0.2s ease;
        }
        footer a:hover i {
            transform: scale(1.1);
        }

        /* ---------------- PROFILE PIC ANIMATION ---------------- */
        .profile-pic {
            transition: 0.3s ease-in-out;
        }
        .profile-pic:hover {
            filter: brightness(1.4);
            transform: scale(1.03);
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.7);
        }

        /* ---------------- FADE UP ANIMATION ---------------- */
        .fade-up {
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUpAnim 0.7s ease-out forwards;
        }
        @keyframes fadeUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------------- ZOOM IN ANIMATION ---------------- */
        .zoom-in {
            opacity: 0;
            transform: scale(0.95);
            animation: zoomInAnim 0.7s ease-out forwards;
        }
        @keyframes zoomInAnim {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

    </style>
</head>
<body>

<nav>
    <div class="logo">Yenumula Teja Avs</div>
    <div class="links">
        <a href="/">Home</a>
        <a href="/projects/">Projects</a>
        <a href="/contact/">Contact</a>

        {% block extra_nav %}{% endblock %}
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer>
    <div style="margin-bottom: 20px; display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;">

        <a href="#" style="display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-location-dot" style="color: #3b82f6; font-size: 22px;"></i>
            Andhra Pradesh, India
        </a>

        <a href="mailto:tejaavs2@gmail.com" style="display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-envelope" style="color: #3b82f6; font-size: 22px;"></i>
            tejaavs2@gmail.com
        </a>

        <a href="https://www.linkedin.com/in/y-teja-avs/" target="_blank"
           style="display: flex; align-items: center; gap: 8px;">
            <i class="fa-brands fa-linkedin" style="color: #3b82f6; font-size: 22px;"></i>
            LinkedIn
        </a>

        <a href="https://www.instagram.com/teja.avs/" target="_blank"
           style="display: flex; align-items: center; gap: 8px;">
            <i class="fa-brands fa-instagram" style="color: #e1306c; font-size: 22px;"></i>
            Instagram
        </a>

    </div>

    <p style="opacity: 0.7; font-size: 14px;">
        © {{ now|date:"Y" }} Teja — All Rights Reserved.
    </p>
</footer>

</body>
</html>
